name: Build native PS5 Niak Home title (experimental)
on:
  push:
    paths:
      - native/title/**
      - native/catalog.c
      - native/catalog.h
      - native/shadowmount_api.c
      - native/shadowmount_api.h
      - native/shadowmount_http.h
      - .github/workflows/native-title.yml
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Only the newest revision of a branch needs the expensive SDK + OpenGL
# build. Cancel superseded commits instead of filling the runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             clang-18 lld-18 llvm-18 ninja-build cmake make git curl             python3 python3-pip python3-pil python3-mako python3-yaml libegl1-mesa-dev libgl1-mesa-dev libsqlite3-dev             pkg-config zip unzip zlib1g-dev xxd ca-certificates
      - name: Source-level validation
        run: |
          python3 -m unittest discover -s native/title/tests -p 'test_*.py' -v
          python3 -m py_compile native/title/prepare.py
          bash -n native/title/build.sh
      - name: Build native title using pinned GPU renderer
        run: bash native/title/build.sh
      - name: Capture real NiakPS5 UI using Mesa OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
          GALLIUM_DRIVER: llvmpipe
          USE_CCACHE: '0'
          NIAK_CASE_PREVIEW_ASSETS: ${{ github.workspace }}/.build/ps5-title-kit/assets/niak-preview-cases
          NIAK_CASE_TEMPLATE_ASSETS: ${{ github.workspace }}/.build/ps5-title-kit/assets/niak-preview-templates
          NIAK_CASE_PREVIEW_MEDIA: ${{ github.workspace }}/.build/ps5-title-kit/assets/niak-preview-media
        run: |
          python3 native/title/host_preview.py --kit .build/ps5-title-kit
          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          home=Path(os.environ["NIAK_CASE_TEMPLATE_ASSETS"])
          for family in ("ps4","ps5"):
              for side in ("front","back","spine"):
                  path=home/f"{family}-{side}.png"
                  if not path.is_file():
                      raise SystemExit(f"Missing fixed preview template: {path}")
                  with Image.open(path) as art:
                      art.verify()
                  print(f"CI template ready: {path.name}")
          PY
          rm -rf build/niak-preview
          NIAK_CASE_TOUR=1 USE_CCACHE=0 bash .build/ps5-title-kit/tools/host-snapshots.sh build/niak-preview aurora 1920 1080
          python3 native/title/validate_preview.py build/niak-preview
      - name: Upload genuine native UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NiakPS5-OpenGL-interface-preview
          path: build/niak-preview/*.png
          if-no-files-found: warn
      - name: Validate single-level FTP data folder
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path('dist/ftp-dropin')
          assert sorted(p.name for p in base.iterdir())==['data']
          root=base/'data'
          title=root/'homebrew/PPSA99386'
          payload=root/'pldmgr/payloads/niakps5'
          for f in (title/'eboot.bin',title/'sce_module/libc.prx',
                    title/'sce_sys/param.json',payload/'niakps5.elf',
                    payload/'niakps5.elf.json'):
              assert f.is_file() and f.stat().st_size>0,f
          assert json.loads((title/'sce_sys/param.json').read_text())['titleId']=='PPSA99386'
          elf=(payload/'niakps5.elf').read_bytes()
          assert elf==(title/'tools/niakps5/niakps5.elf').read_bytes()
          assert json.loads((payload/'niakps5.elf.json').read_text())['checksum']==hashlib.sha256(elf).hexdigest()
          for console in ('ps4','ps5'):
              for side in ('front','back','spine'):
                  assert (title/f'assets/niak-templates/{console}-{side}.png').is_file()
          assert not any(p.suffix.lower()=='.zip' for p in base.rglob('*'))
          assert not any('autoload.txt' in p.name or 'pldmgr_config.txt' in p.name for p in base.rglob('*'))
          print('FTP delivery validated: exactly one data/ directory, zero nested ZIPs')
          PY
      # GitHub Actions produces ONE ZIP directly from data/. Executable
      # permissions may be normalized and require checking on real PS5 FTP.
      - name: Upload single FTP directory
        uses: actions/upload-artifact@v4
        with:
          name: NiakPS5-PPSA99386
          path: dist/ftp-dropin/
          if-no-files-found: error
          compression-level: 6

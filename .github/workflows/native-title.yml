name: Build native PS5 Niak Home title (experimental)
on:
  push:
    paths:
      - native/title/**
      - native/catalog.c
      - native/catalog.h
      - native/shadowmount_api.c
      - native/shadowmount_api.h
      - native/shadowmount_http.h
      - .github/workflows/native-title.yml
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Only the newest revision of a branch needs the expensive SDK + OpenGL
# build. Cancel superseded commits instead of filling the runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             clang-18 lld-18 llvm-18 ninja-build cmake make git curl             python3 python3-pip python3-pil python3-mako python3-yaml libegl1-mesa-dev libgl1-mesa-dev libsqlite3-dev             pkg-config zip unzip zlib1g-dev xxd ca-certificates
      - name: Source-level validation
        run: |
          python3 -m unittest discover -s native/title/tests -p 'test_*.py' -v
          python3 -m py_compile native/title/prepare.py
          bash -n native/title/build.sh
      - name: Build native title using pinned GPU renderer
        run: bash native/title/build.sh
      - name: Capture real NiakPS5 UI using Mesa OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
          GALLIUM_DRIVER: llvmpipe
          USE_CCACHE: '0'
          NIAK_CASE_PREVIEW_ASSETS: .build/ps5-title-kit/assets/niak-preview-cases
          NIAK_CASE_TEMPLATE_ASSETS: .build/ps5-title-kit/assets/niak-preview-templates
          NIAK_CASE_PREVIEW_MEDIA: .build/ps5-title-kit/assets/niak-preview-media
        run: |
          python3 native/title/host_preview.py --kit .build/ps5-title-kit
          USE_CCACHE=0 bash .build/ps5-title-kit/tools/host-snapshots.sh build/niak-preview aurora 1920 1080
          NIAK_CASE_TOUR=1 USE_CCACHE=0 bash .build/ps5-title-kit/tools/host-snapshots.sh build/niak-preview aurora 1920 1080
          python3 native/title/validate_preview.py build/niak-preview
      - name: Upload genuine native UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NiakPS5-OpenGL-interface-preview
          path: build/niak-preview/*.png
          if-no-files-found: warn
      - name: Confirm complete title package
        run: |
          test -s dist/PPSA99386/eboot.bin
          test -s dist/PPSA99386/sce_sys/param.json
          test -s dist/PPSA99386/sce_module/libc.prx
          test -s dist/PPSA99386/tools/niakps5/niakps5.elf
          test -s dist/PPSA99386/sandbox-elevator.elf
          test -s dist/PPSA99386.zip
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('dist/PPSA99386/sce_sys/param.json').read_text())
          assert p['titleId']=='PPSA99386'
          assert p['localizedParameters'][p['localizedParameters']['defaultLanguage']]['titleName']=='NiakPS5'
          print('Title metadata verified.')
          PY
          python3 - <<'PY'
          import stat
          from zipfile import ZipFile
          with ZipFile('dist/PPSA99386.zip') as z:
              assert z.testzip() is None
              assert all(p.startswith('PPSA99386/') for p in z.namelist())
              assert not any(p.endswith('.zip') or (p.endswith('.elf') and p not in ('PPSA99386/tools/niakps5/niakps5.elf', 'PPSA99386/sandbox-elevator.elf')) for p in z.namelist())
              assert (z.getinfo('PPSA99386/').external_attr >> 16) & 0o777 == 0o755
              assert (z.getinfo('PPSA99386/eboot.bin').external_attr >> 16) & 0o777 == 0o755
              assert (z.getinfo('PPSA99386/tools/niakps5/niakps5.elf').external_attr >> 16) & 0o777 == 0o755
              assert (z.getinfo('PPSA99386/sandbox-elevator.elf').external_attr >> 16) & 0o777 == 0o755
              assert (z.getinfo('PPSA99386/sce_sys/param.json').external_attr >> 16) & 0o777 == 0o644
          print('FTP ZIP verified (one root folder, modes, no nested ZIP)')
          PY
          sha256sum dist/PPSA99386.zip
      # GitHub Actions always wraps uploaded files in its OWN ZIP.
      # Uploading dist/PPSA99386.zip would produce ZIP -> ZIP -> title.
      # Validate the original install ZIP above, then upload its already
      # unpacked directory so the GitHub download has exactly ONE ZIP layer:
      # NiakPS5-PPSA99386.zip -> PPSA99386/ -> eboot.bin, tools/, ...
      - name: Stage single-layer download archive
        run: |
          rm -f dist/PPSA99386.zip
          python3 - <<'PY'
          from pathlib import Path
          root=Path('dist')
          assert [p.name for p in root.iterdir()] == ['PPSA99386']
          title=root/'PPSA99386'
          assert (title/'eboot.bin').stat().st_size > 0
          assert (title/'sce_sys/param.json').stat().st_size > 0
          assert (title/'tools/ftp_install.py').stat().st_size > 0
          assert not any(p.suffix.lower()=='.zip' for p in title.rglob('*'))
          print('GitHub artifact staging verified: single top-level PPSA99386/ directory, no nested ZIP')
          PY
      - name: Upload single ZIP installation package
        uses: actions/upload-artifact@v4
        with:
          name: NiakPS5-PPSA99386
          path: dist/
          if-no-files-found: error

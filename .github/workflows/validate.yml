name: Validate NiakPS5
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - name: Artwork URL diagnostics
        run: |
          for URL in \
            https://cdn.cloudflare.steamstatic.com/steam/apps/3764200/library_hero.jpg \
            https://cdn.cloudflare.steamstatic.com/steam/apps/3764200/library_600x900.jpg \
            https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3764200/library_hero.jpg \
            https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3357650/library_600x900.jpg \
            https://shared.fastly.steamstatic.com/steam/apps/3764200/library_hero.jpg; do
            curl -L -m 15 -s -o /dev/null -w '%{http_code} %{url_effective}\\n' "$URL" || true
          done
      - name: Browser rendering smoke test
        run: |
          python3 -m http.server 8787 >/tmp/niakps5-http.log 2>&1 &
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then echo "No headless Chrome available"; exit 1; fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=2500 --window-size=1600,900 --dump-dom http://127.0.0.1:8787/ > /tmp/niakps5-dom.html 2>/tmp/niakps5-chrome.log
          grep -q 'game-card' /tmp/niakps5-dom.html
          grep -q 'Resident Evil Requiem' /tmp/niakps5-dom.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=2500 --window-size=1600,900 --screenshot=niakps5-preview.png http://127.0.0.1:8787/ 2>/tmp/niakps5-screenshot.log
          test -s niakps5-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: niakps5-preview
          path: niakps5-preview.png

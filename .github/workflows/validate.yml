name: Validate NiakPS5
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host catalogue dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc libsqlite3-dev
      - name: Compile catalogue and test with an isolated filesystem
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I native native/catalog.c native/tests/catalog_test.c -lsqlite3 -o /tmp/niak-catalog
          /tmp/niak-catalog
      - name: Validate one-shot game-to-home redirect gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/redirect_gate_test.c -o /tmp/niak-redirect-gate
          /tmp/niak-redirect-gate
      - name: Reject SIGPIPE on disconnected local broker sockets
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/socket_guard_test.c -o /tmp/niak-socket-guard
          /tmp/niak-socket-guard
      - name: Validate installed PS5 title launch permissions
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror native/title/tests/title_permissions_test.c -o /tmp/niak-title-permissions
          /tmp/niak-title-permissions
      - name: Validate PS5 installed media category parsing
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/title_category_test.c -o /tmp/niak-title-category
          /tmp/niak-title-category
      - name: Validate HTTP game icon framing and persistent connections
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror native/title/tests/http_icon_response_test.cpp -o /tmp/niak-http-icon
          /tmp/niak-http-icon
      - name: Validate native PS5 DDS avatar decoder on host
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I native/title native/title/avatar_dds.cpp native/title/tests/avatar_dds_test.cpp -o /tmp/niak-dds-test
          /tmp/niak-dds-test
      - name: Compile and test local ShadowMountPlus API reader
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I native native/catalog.c native/shadowmount_api.c native/tests/shadowmount_test.c -lsqlite3 -o /tmp/niak-shadowmount
          /tmp/niak-shadowmount
      - name: Validate title staging and FTP package
        run: |
          python3 -m unittest discover -s native/title/tests -p 'test_*.py' -v
          python3 -m py_compile native/title/*.py
          bash -n native/title/build.sh
      - name: Scan tracked text sources for personal data or credentials
        run: python3 native/title/tests/audit_repository.py

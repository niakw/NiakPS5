name: Validate NiakPS5
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install host catalogue dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc libsqlite3-dev python3-pil
      - name: Require actual host WebP codec coverage
        run: python3 -c "from PIL import features; assert features.check('webp'), 'WebP codec required by NiakPS5 tests'"
      - name: Compile PS5 broker source as C before expensive native build
        run: |
          # Syntax-only: proprietary symbols are linked by the native PS5
          # toolchain later. Catch C++-only syntax in this C source early.
          cc -std=gnu11 -D_GNU_SOURCE -Wall -Wextra -fsyntax-only -I native/title native/title/autostart.c
      - name: Compile catalogue and test with an isolated filesystem
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I native native/catalog.c native/tests/catalog_test.c -lsqlite3 -o /tmp/niak-catalog
          /tmp/niak-catalog
      - name: Validate bounded PLDmgr read-only game enumeration
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror native/title/tests/broker_inventory_test.c -o /tmp/niak-inventory
          /tmp/niak-inventory
      - name: Validate one-shot game-to-home redirect gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/redirect_gate_test.c -o /tmp/niak-redirect-gate
          /tmp/niak-redirect-gate
      - name: Reject SIGPIPE on disconnected local broker sockets
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/socket_guard_test.c -o /tmp/niak-socket-guard
          /tmp/niak-socket-guard
      - name: Validate bounded local service connections
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/loopback_connect_test.c -o /tmp/niak-loopback-connect
          /tmp/niak-loopback-connect
      - name: Validate PS5 launch context and 0x80940005 fallback
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/launch_policy_test.c -o /tmp/niak-launch-policy
          /tmp/niak-launch-policy
      - name: Validate installed PS5 title launch permissions
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror native/title/tests/title_permissions_test.c -o /tmp/niak-title-permissions
          /tmp/niak-title-permissions
      - name: Validate UTF-8 localized game titles
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/localized_name_test.c -o /tmp/niak-localized-name
          /tmp/niak-localized-name
      - name: Validate PS5 installed media category parsing
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/title/tests/title_category_test.c -o /tmp/niak-title-category
          /tmp/niak-title-category
      - name: Validate HTTP game icon framing and persistent connections
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror native/title/tests/http_icon_response_test.cpp -o /tmp/niak-http-icon
          /tmp/niak-http-icon
      - name: Limit repeated local icon endpoint transport failures
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror native/title/tests/icon_endpoint_policy_test.cpp -o /tmp/niak-icon-endpoint
          /tmp/niak-icon-endpoint
      - name: Validate prioritized cover stream queue
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror native/title/tests/cover_stream_state_test.cpp -o /tmp/niak-cover-queue
          /tmp/niak-cover-queue
      - name: Validate game/application category routing
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror native/title/tests/app_classification_test.cpp -o /tmp/niak-app-class
          /tmp/niak-app-class
      - name: Validate bounded 3D case texture resampling
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror native/title/tests/case_texture_scale_test.cpp -o /tmp/niak-case-texture
          /tmp/niak-case-texture
      - name: Validate native PS5 DDS avatar decoder on host
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I native/title native/title/avatar_dds.cpp native/title/tests/avatar_dds_test.cpp -o /tmp/niak-dds-test
          /tmp/niak-dds-test
      - name: Compile and test local ShadowMountPlus API reader
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I native -I native/title native/catalog.c native/shadowmount_api.c native/tests/shadowmount_test.c -lsqlite3 -o /tmp/niak-shadowmount
          /tmp/niak-shadowmount
      - name: Validate title staging and FTP package
        run: |
          python3 -m unittest discover -s native/title/tests -p 'test_*.py' -v
          python3 -m py_compile native/title/*.py
          bash -n native/title/build.sh
      - name: Scan tracked text sources for personal data or credentials
        run: python3 native/title/tests/audit_repository.py
